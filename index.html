<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newport Fugitives Statistics Centre</title>
<meta name="description" content="Search Newport Fugitives Cricket Club career statistics from 1990 onwards.">
<style>
:root{
  --navy:#071d34;--navy2:#0c2e50;--gold:#f3bd35;--cream:#f7f3e8;
  --white:#fff;--ink:#132238;--muted:#64748b;--line:#dbe3ec;--green:#176b4d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f6;color:var(--ink)}
button,input,select{font:inherit}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:22px 18px 42px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;width:330px;height:330px;border:60px solid rgba(243,189,53,.08);border-radius:50%;right:-160px;top:-180px}
.header-inner{max-width:1180px;margin:auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px}
.crest{width:62px;height:70px;background:var(--gold);color:var(--navy);clip-path:polygon(50% 0,92% 15%,85% 78%,50% 100%,15% 78%,8% 15%);display:grid;place-items:center;font-weight:900;line-height:.9;text-align:center;font-size:15px}
h1{margin:0;font-size:clamp(27px,5vw,47px);letter-spacing:-1.4px}
.subtitle{margin:5px 0 0;color:#cedced;font-size:15px}
.hero-search{margin-top:25px;max-width:680px;display:flex;background:white;border-radius:14px;padding:6px;box-shadow:0 12px 35px rgba(0,0,0,.22)}
.hero-search input{flex:1;border:0;padding:13px 14px;outline:none;min-width:0;color:var(--ink)}
.hero-search button{border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:10px;padding:0 18px;cursor:pointer}
main{max-width:1180px;margin:-22px auto 50px;padding:0 18px;position:relative;z-index:2}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.summary-card{background:white;border-radius:15px;padding:18px;box-shadow:0 6px 22px rgba(18,42,65,.08);border:1px solid rgba(219,227,236,.9)}
.summary-card strong{display:block;font-size:25px;color:var(--navy)}
.summary-card span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.toolbar{margin-top:22px;background:white;border-radius:15px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line)}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{border:0;background:#edf2f7;color:#334155;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer}
.tab.active{background:var(--navy);color:white}
.toolbar select{margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:26px 2px 11px}
.section-title h2{margin:0;color:var(--navy)}
.section-title small{color:var(--muted)}
.table-wrap{background:white;border:1px solid var(--line);border-radius:15px;overflow:auto;box-shadow:0 4px 18px rgba(18,42,65,.06)}
table{width:100%;border-collapse:collapse;min-width:790px}
th{background:#f1f5f9;color:#475569;text-align:right;padding:12px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.55px;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{padding:12px 11px;border-top:1px solid #edf1f5;text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fff9e8}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#edf2f7;font-weight:800;margin-right:8px}
.name{font-weight:800;color:var(--navy)}
.role{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-left:38px}
.empty{text-align:center;padding:50px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(3,15,28,.74);z-index:20;padding:18px;overflow:auto}
.modal.open{display:grid;place-items:center}
.modal-card{width:min(760px,100%);background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.profile-head{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:25px;display:flex;justify-content:space-between;gap:20px}
.profile-head h2{margin:0;font-size:31px}
.profile-head p{margin:5px 0 0;color:#cad8e7}
.close{background:rgba(255,255,255,.12);border:0;color:white;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
.profile-body{padding:22px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.stat-panel{border:1px solid var(--line);border-radius:14px;padding:16px}
.stat-panel h3{margin:0 0 13px;color:var(--navy)}
.stat-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f6f8fb;border-radius:10px;padding:10px}
.stat b{display:block;font-size:19px;color:var(--navy)}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800}
.note{margin-top:18px;background:#fff7dc;border-left:4px solid var(--gold);padding:11px 13px;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 18px 30px}
@media(max-width:720px){
 .summary-grid{grid-template-columns:1fr 1fr}
 .profile-grid{grid-template-columns:1fr}
 .toolbar select{margin-left:0;width:100%}
 .hero-search button{padding:0 12px}
}
</style>
</head>
<body>
<header>
 <div class="header-inner">
  <div class="brand">
   <div class="crest">NF<br>CC</div>
   <div><h1>Newport Fugitives Statistics Centre</h1><p class="subtitle">Career records from 1990 to the present day</p></div>
  </div>
  <div class="hero-search">
   <input id="search" type="search" placeholder="Search for a player…" autocomplete="off">
   <button onclick="focusResults()">Search</button>
  </div>
 </div>
</header>

<main>
 <section class="summary-grid">
  <div class="summary-card"><strong id="playerCount">0</strong><span>Players</span></div>
  <div class="summary-card"><strong id="totalMatches">0</strong><span>Player appearances</span></div>
  <div class="summary-card"><strong id="totalRuns">0</strong><span>Career runs</span></div>
  <div class="summary-card"><strong id="totalWickets">0</strong><span>Career wickets</span></div>
 </section>

 <section class="toolbar">
  <div class="tabs">
   <button class="tab active" data-view="players">All Players</button>
   <button class="tab" data-view="runs">Batting</button>
   <button class="tab" data-view="wickets">Bowling</button>
   <button class="tab" data-view="allrounders">All-rounders</button>
   <button class="tab" data-view="matches">Appearances</button>
  </div>
  <select id="qualification">
   <option value="all">All qualifying players</option>
   <option value="major">Established careers only</option>
  </select>
 </section>

 <div class="section-title">
  <h2 id="viewTitle">Player Directory</h2>
  <small id="resultCount"></small>
 </div>

 <div class="table-wrap">
  <table>
   <thead id="tableHead"></thead>
   <tbody id="tableBody"></tbody>
  </table>
 </div>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeProfile()">
 <article class="modal-card">
  <div class="profile-head">
   <div><h2 id="profileName"></h2><p id="profileRole"></p></div>
   <button class="close" onclick="closeProfile()" aria-label="Close">×</button>
  </div>
  <div class="profile-body" id="profileBody"></div>
 </article>
</div>

<footer>Newport Fugitives Cricket Club · Statistics supplied by the club · Built as a searchable static website</footer>

let currentView = "players";

const fmt = n => Number(n||0).toLocaleString("en-GB");
const dec = n => Number(n||0).toFixed(2);

document.getElementById("playerCount").textContent = fmt(players.length);
document.getElementById("totalMatches").textContent = fmt(players.reduce((a,p)=>a+p.matches,0));
document.getElementById("totalRuns").textContent = fmt(players.reduce((a,p)=>a+p.runs,0));
document.getElementById("totalWickets").textContent = fmt(players.reduce((a,p)=>a+p.wickets,0));

const configs = {
 players:{title:"Player Directory",sort:(a,b)=>a.name.localeCompare(b.name),heads:["Player","Matches","Runs","Bat Ave","Wickets","Bowl Ave"],cells:p=>[p.matches,fmt(p.runs),dec(p.batAverage),p.wickets,p.wickets?dec(p.bowlAverage):"—"]},
 runs:{title:"Batting Leaderboard",sort:(a,b)=>b.runs-a.runs,heads:["Player","Matches","Runs","Average","50s","100s","High Score"],cells:p=>[p.matches,fmt(p.runs),dec(p.batAverage),p.fifties,p.hundreds,p.highScore||"—"]},
 wickets:{title:"Bowling Leaderboard",sort:(a,b)=>b.wickets-a.wickets,heads:["Player","Overs","Wickets","Average","Economy","Maidens"],cells:p=>[p.overs,p.wickets,p.wickets?dec(p.bowlAverage):"—",p.balls?dec(p.economy):"—",p.maidens]},
 allrounders:{title:"All-rounder Leaderboard",sort:(a,b)=>b.mvpScore-a.mvpScore,heads:["Player","Runs","Bat Ave","Wickets","Bowl Ave","Impact Score"],cells:p=>[fmt(p.runs),dec(p.batAverage),p.wickets,p.wickets?dec(p.bowlAverage):"—",dec(p.mvpScore)]},
 matches:{title:"Appearance Leaderboard",sort:(a,b)=>b.matches-a.matches,heads:["Player","Matches","Innings","Runs","Wickets","Role"],cells:p=>[p.matches,p.innings,fmt(p.runs),p.wickets,p.role]}
};

function filtered(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const qual=document.getElementById("qualification").value;
 return players.filter(p=>{
   const queryOk=!q || p.name.toLowerCase().includes(q);
   let viewOk=true;
   if(currentView==="wickets") viewOk=p.wickets>0;
   if(currentView==="allrounders") viewOk=p.runs>=250 && p.wickets>=10;
   let qualOk=true;
   if(qual==="major"){
     if(currentView==="wickets") qualOk=p.wickets>=25;
     else if(currentView==="runs") qualOk=p.innings>=30;
     else if(currentView==="allrounders") qualOk=p.runs>=750 && p.wickets>=40;
     else qualOk=p.matches>=30;
   }
   return queryOk && viewOk && qualOk;
 }).sort(configs[currentView].sort);
}

function render(){
 const cfg=configs[currentView], data=filtered();
 document.getElementById("viewTitle").textContent=cfg.title;
 document.getElementById("resultCount").textContent=`${data.length} result${data.length===1?"":"s"}`;
 document.getElementById("tableHead").innerHTML="<tr>"+cfg.heads.map(h=>`<th>${h}</th>`).join("")+"</tr>";
 const body=document.getElementById("tableBody");
 if(!data.length){body.innerHTML=`<tr><td colspan="${cfg.heads.length}" class="empty">No matching players found.</td></tr>`;return}
 body.innerHTML=data.map((p,i)=>{
   const first=`<td><span class="rank">${i+1}</span><span class="name">${p.name}</span><span class="role">${p.role}</span></td>`;
   return `<tr onclick='openProfile(${JSON.stringify(p.name)})'>${first}${cfg.cells(p).map(x=>`<td>${x}</td>`).join("")}</tr>`;
 }).join("");
}

function openProfile(name){
 const p=players.find(x=>x.name===name);
 document.getElementById("profileName").textContent=p.name;
 document.getElementById("profileRole").textContent=`${p.role} · ${fmt(p.matches)} matches`;
 document.getElementById("profileBody").innerHTML=`
 <div class="profile-grid">
  <section class="stat-panel"><h3>Batting</h3><div class="stat-list">
   ${stat("Runs",fmt(p.runs))}${stat("Average",dec(p.batAverage))}
   ${stat("Innings",p.innings)}${stat("Not outs",p.notOuts)}
   ${stat("50s",p.fifties)}${stat("100s",p.hundreds)}
   ${stat("High score",p.highScore||"—")}${stat("Matches",p.matches)}
  </div></section>
  <section class="stat-panel"><h3>Bowling</h3><div class="stat-list">
   ${stat("Wickets",p.wickets)}${stat("Average",p.wickets?dec(p.bowlAverage):"—")}
   ${stat("Overs",p.overs)}${stat("Economy",p.balls?dec(p.economy):"—")}
   ${stat("Maidens",p.maidens)}${stat("Runs conceded",fmt(p.runsConceded))}
  </div></section>
 </div>
 <div class="note">Career record held in the Newport Fugitives statistics archive. Bowling overs are handled using six-ball cricket notation.</div>`;
 document.getElementById("modal").classList.add("open");
 document.body.style.overflow="hidden";
}
function stat(label,value){return `<div class="stat"><b>${value}</b><span>${label}</span></div>`}
function closeProfile(){document.getElementById("modal").classList.remove("open");document.body.style.overflow=""}
function focusResults(){document.querySelector(".section-title").scrollIntoView({behavior:"smooth"})}
document.getElementById("search").addEventListener("input",render);
document.getElementById("qualification").addEventListener("change",render);
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");currentView=btn.dataset.view;render();
}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProfile()});
render();
</script>
